<!DOCTYPE html>
<html>
<head>
<title>Order History</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2
}

.box{
width:90%;
margin:auto;
margin-top:30px;
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.order{
background:#fff3e0;
padding:15px;
margin:12px 0;
border-radius:10px;
border-left:6px solid #ff5722;
}
</style>
</head>

<body>

<div class="box">
<h2>📦 Your Orders</h2>
<div id="orderList"></div>
</div>

<script>

async function loadHistory(){
let rawUser = localStorage.getItem("user");
let user = null;

try{
user = rawUser ? JSON.parse(rawUser) : null;
}catch(error){
user = null;
}

if(!user || !user.id){
document.getElementById("orderList").innerHTML = "Please login to view your order history.";
return;
}

try{
const response = await fetch(`/api/orders?userId=${encodeURIComponent(user.id)}`);
const orders = await response.json();

if(!response.ok){
document.getElementById("orderList").innerHTML = "Unable to load orders.";
return;
}

if(!orders.length){
document.getElementById("orderList").innerHTML = "No orders found.";
return;
}

let html="";

orders.forEach(o=>{
const formattedDate = new Date(o.date).toLocaleString("en-IN", {
year: "numeric",
month: "short",
day: "2-digit",
hour: "2-digit",
minute: "2-digit"
});

html += `
<div class="order">
<b>${o.name}</b> — ${formattedDate}
<p>📱 ${o.mobile}</p>
<p>📍 ${o.address}</p>
<p>Items: ${o.items.length}</p>
<p>Status: ${o.status}</p>
</div>`;
});

document.getElementById("orderList").innerHTML = html;

}catch(error){
document.getElementById("orderList").innerHTML = "Unable to connect to server.";
}
}

loadHistory();

</script>

</body>
</html>
